name: mobile_app
description: College bus tracking student and driver app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.2
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  flutter_foreground_task: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
